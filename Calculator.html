<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>body{font-family:Arial;background:#eef;padding:15px}.box{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:12px}input{width:100%;padding:10px}button{padding:10px}.g{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ccc;padding:8px}th{background:#1565c0;color:#fff}</style></head><body><div class='box'><h2>🏢 Calculadora de Inversión</h2><div class='g'><input id='d' placeholder='Descripción'><input id='f' type='tel' inputmode='numeric' placeholder='Factura'><input id='m' inputmode='decimal' placeholder='Monto'><button onclick='a()'>Agregar</button></div><table><thead><tr><th>Descripción</th><th>Factura</th><th>Monto</th><th></th></tr></thead><tbody id='t'></tbody></table><h2>TOTAL L <span id='tot'>0.00</span></h2><button onclick='pdf()'>📄 PDF</button> <button onclick='xls()'>📊 Excel</button></div><script>let data=[],tt=0;function fm(n){return Number(n).toLocaleString('es-HN',{minimumFractionDigits:2})}function r(){tt=0;t.innerHTML='';data.forEach((x,i)=>{tt+=x.m;let tr=document.createElement('tr');tr.innerHTML=`<td>${x.d}</td><td>${x.f}</td><td style='text-align:right'>L ${fm(x.m)}</td><td><button onclick='b(${i})'>X</button></td>`;t.appendChild(tr)});tot.textContent=fm(tt)}function a(){let mm=parseFloat(m.value.replace(',','.'));if(!d.value||isNaN(mm)){alert('Complete datos');return;}data.push({d:d.value,f:f.value,m:mm});d.value='';f.value='';m.value='';r()}function b(i){data.splice(i,1);r()}async function pdf(){const{jsPDF}=window.jspdf;let doc=new jsPDF();doc.text('Inversión del Local',15,15);let y=30;data.forEach(v=>{doc.text(v.d,15,y);doc.text(v.f||'-',90,y);doc.text('L '+fm(v.m),145,y);y+=8});doc.text('TOTAL L '+fm(tt),15,y+10);doc.save('Inversion_Local.pdf')}function xls(){let aoa=[['Descripción','Factura','Monto']];data.forEach(v=>aoa.push([v.d,v.f,v.m]));aoa.push(['','','']);aoa.push(['TOTAL','','L '+fm(tt)]);let ws=XLSX.utils.aoa_to_sheet(aoa);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Inversion');XLSX.writeFile(wb,'Inversion_Local.xlsx')}</script></body></html>
