<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Calculadora de Inversión</title>

<style>

body{

font-family:Arial;

background:#edf2f7;

margin:15px;

}

.card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 3px 10px rgba(0,0,0,.2);

max-width:900px;

margin:auto;

}

h2{

margin-top:0;

}

input, select{

width:100%;

padding:12px;

font-size:16px;

border:1px solid #ccc;

border-radius:8px;

box-sizing:border-box;

}

.grid{

display:grid;

grid-template-columns:2fr 1fr 1fr;

gap:10px;

}

button{

padding:12px;

font-size:16px;

border:none;

border-radius:8px;

background:#1976d2;

color:white;

cursor:pointer;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

th{

background:#1976d2;

color:white;

padding:10px;

}

td{

padding:10px;

border:1px solid #ddd;

}

.total{

font-size:28px;

font-weight:bold;

text-align:right;

margin-top:15px;

}

.borrar{

background:#d32f2f;

}

/* Estilos para impresión: repetir encabezados y controlar saltos de página */
@media print {
  @page { size: auto; margin: 10mm; }
  html, body { background: white; margin: 0; padding: 0; }
  .card { box-shadow: none; border-radius: 0; max-width: 100%; padding: 0; }
  table { page-break-inside: auto; }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; page-break-after: auto; }
  td, th { -webkit-print-color-adjust: exact; }
}

</style>

</head>

<body>

<div class="card">

<h2>🏢 Calculadora de Inversión</h2>

<div class="grid">

<!-- Descripción cambiado a dropdown con dos opciones -->
<select id="descripcion">
  <option value="Materiales">Materiales</option>
  <option value="Mano de Obra">Mano de Obra</option>
</select>

<!-- La factura se autogenerará; el campo es readonly y muestra el siguiente número -->
<input
id="factura"
placeholder="Factura"
type="text"
readonly>

<input
id="monto"
placeholder="Monto"
type="text"
inputmode="decimal">

</div>

<br>

<button onclick="agregar()">

Agregar

</button>

<!-- Botón para exportar a PDF (usa la ventana de impresión del navegador) -->
<button onclick="imprimirPDF()" style="margin-left:10px;background:#4caf50">Exportar a PDF</button>

<table>

<thead>

<tr>

<th>Descripción</th>

<th>Factura</th>

<th>Monto</th>

<th></th>

</tr>

</thead>

<tbody id="tbody">

</tbody>

</table>

<div class="total">

TOTAL L

<span id="total">0.00</span>

</div>

</div>

<script>

let total=0;
let facturaCounter = 1; // comienza en 1 -> 0001

function formatFactura(n){
  return n.toString().padStart(4,'0');
}

// inicializar el campo factura con 0001
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('factura').value = formatFactura(facturaCounter);
  document.getElementById('descripcion').focus();
});

function agregar(){
const descripcion=document.getElementById("descripcion").value.trim();
const factura=document.getElementById("factura").value.trim();
let monto=document.getElementById("monto").value;

monto=monto.replace(",", ".");

monto=parseFloat(monto);

if(descripcion=="" || isNaN(monto)){
alert("Ingrese descripción y monto");
return;
}

const tbody=document.getElementById("tbody");
const fila=document.createElement("tr");

// capturamos el monto y factura actuales para que el handler de borrar use los valores correctos
const montoGuardado = monto;
const facturaGuardada = factura;

fila.innerHTML=`
<td>${descripcion}</td>
<td>${facturaGuardada}</td>
<td style="text-align:right">
L ${montoGuardado.toLocaleString("es-HN",{minimumFractionDigits:2})}
</td>
<td>
<button class="borrar">X</button>
</td>
`;

fila.querySelector("button").onclick=function(){
total-=montoGuardado;
actualizar();
fila.remove();
};

tbody.appendChild(fila);

total+=montoGuardado;
actualizar();

// incrementar el contador de facturas y actualizar el campo readonly
facturaCounter++;
document.getElementById('factura').value = formatFactura(facturaCounter);

// limpiar monto y enfocar
// mantenemos la selección (descripcion) porque ahora es dropdown
document.getElementById("monto").value="";
document.getElementById("descripcion").focus();
}

function actualizar(){
document.getElementById("total").innerHTML=
total.toLocaleString("es-HN",{minimumFractionDigits:2});
}

// Abre una nueva ventana con el contenido listo para imprimir. Esto suele evitar truncados
// y hace que el navegador genere todas las páginas en el PDF.
function imprimirPDF(){
  const card = document.querySelector('.card');
  const htmlContent = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Exportar a PDF</title><style>
    body{font-family:Arial;margin:10mm}
    table{width:100%;border-collapse:collapse;margin-top:20px}
    th{background:#1976d2;color:white;padding:10px}
    td{padding:10px;border:1px solid #ddd}
    thead{display:table-header-group}
    @page { size:auto; margin:10mm }
    </style></head><body>` + card.outerHTML + `</body></html>`;

  const w = window.open('', '_blank');
  w.document.open();
  w.document.write(htmlContent);
  w.document.close();
  // Dar tiempo a que el navegador renderice el contenido antes de imprimir
  setTimeout(() => { w.focus(); w.print(); /* w.close(); */ }, 500);
}

</script>

</body>

</html>
